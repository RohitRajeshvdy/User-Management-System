<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Auth Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fb;
        color: #222;
      }

      h2 {
        text-align: center;
      }

      form {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #1d4ed8;
      }

      .response {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background: #eef2ff;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>Auth Test</h2>

    <form id="signupForm">
      <h3>Sign Up</h3>
      <label>Name</label>
      <input type="text" id="signupName" placeholder="Enter name" required />

      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="Enter email" required />

      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Enter password" required />

      <button type="submit">Sign Up</button>
    </form>

    <form id="loginForm" style="margin-top: 30px;">
      <h3>Login</h3>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter email" required />

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required />

      <button type="submit">Login</button>
    </form>

    <div id="response" class="response">Response will appear here...</div>

    <script>
      const API_URL = 'http://localhost:3000/api/auth';
      const responseBox = document.getElementById('response');

      function showResponse(data) {
        responseBox.textContent = JSON.stringify(data, null, 2);
      }

      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
          name: document.getElementById('signupName').value,
          email: document.getElementById('signupEmail').value,
          password: document.getElementById('signupPassword').value,
        };

        try {
          const res = await fetch(`${API_URL}/signup`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          showResponse({ status: res.status, ...data });
        } catch (error) {
          showResponse({ error: 'Signup failed', details: error.message });
        }
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        };

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          showResponse({ status: res.status, ...data });
        } catch (error) {
          showResponse({ error: 'Login failed', details: error.message });
        }
      });

      const logoutButton = document.createElement('button');
      logoutButton.type = 'button';
      logoutButton.textContent = 'Logout';
      logoutButton.style.marginTop = '20px';
      logoutButton.addEventListener('click', async () => {
        try {
          const res = await fetch(`${API_URL}/logout`, {
            method: 'POST',
            credentials: 'include',
          });

          const data = await res.json();
          showResponse({ status: res.status, ...data });
        } catch (error) {
          showResponse({ error: 'Logout failed', details: error.message });
        }
      });

      document.body.appendChild(logoutButton);
    </script>
  </body>
</html>
